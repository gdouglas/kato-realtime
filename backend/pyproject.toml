[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kato-api-server"
version = "0.1.0"
description = "API server for the Kato realtime application"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Kato Team"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.1",
    "python-jose>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "requests>=2.32.3",
    "openai>=1.78.1",
]

[project.optional-dependencies]
dev = [
]

[tool.hatch.build]
exclude = [
    ".venv/",
    ".cache/",
    "__pycache__/",
    "*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function" 
